[project]
name = "iniko"
version = "0.1.0"
description = "Django e-commerce platform for selling quality unbranded products."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "django==6.1.1",
    "psycopg[binary]>=3.3.5",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-extensions>=4.1",
    "django-stubs[compatible-mypy]>=6.1.0",
    "ipython>=9.17.1",
    "mypy",
    "ruff>=0.16.6",
    "werkzeug>=3.1.8",
]


[tool.ruff]
line-length = 88
show-fixes = true
output-format = "grouped"

extend-exclude = [
    "**/migrations/*.py",
]


[tool.ruff.lint]
select = [
    "E",    # pycodestyle: style errors.
    "F",    # Pyflakes: unused imports, undefined names, etc.
    "I",    # isort: import sorting and grouping.
    "B",    # flake8-bugbear: likely bugs and questionable patterns.
    "UP",   # pyupgrade: modern Python syntax.
    "N",    # pep8-naming: naming conventions.
    "SIM",  # flake8-simplify: simpler Python constructs.
]

ignore = [
    "E501", # Line length is handled by Ruff formatter.
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = [
    "F403", # Wildcard imports are intentional for split Django settings.
    "F405", # Settings names may originate from wildcard imports.
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]

files = ["apps"]
disallow_untyped_defs = true
warn_return_any = true
show_error_codes = true

exclude = [
    ".*/migrations/.*",
]

[[tool.mypy.overrides]]
module = [
    "config.settings",
    "config.settings.*",
]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"
